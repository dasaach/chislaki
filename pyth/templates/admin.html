<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Экскурсионное бюро - Админ панель</title>

    <style>

        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 30px;
            background: linear-gradient(to right, #eef2ff, #f8fafc);
            color: #1e293b;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 35px;
            font-size: 36px;
            color: #1e293b;
        }

        .form-box {
            background: rgba(255, 255, 255, 0.97);
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 18px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
            transition: 0.2s;
        }

        .form-box:hover {
            transform: translateY(-2px);
        }

        .form-box h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #334155;
            font-size: 24px;
            border-left: 5px solid #6366f1;
            padding-left: 12px;
        }

        label {
            display: inline-block;
            width: 190px;
            font-weight: 600;
            color: #334155;
        }

        input,
        select {
            width: 260px;
            padding: 10px;
            margin: 6px 0;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            font-size: 14px;
            transition: 0.2s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #6366f1;
            background: white;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        button {
            background: linear-gradient(to right, #6366f1, #8b5cf6);
            color: white;
            border: none;
            padding: 11px 24px;
            cursor: pointer;
            border-radius: 12px;
            margin-left: 195px;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.03);
            opacity: 0.93;
        }

        .message {
            padding: 14px;
            margin-bottom: 20px;
            border-radius: 12px;
            font-weight: 500;
        }

        .success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        hr {
            margin: 25px 0;
            border: none;
            height: 1px;
            background: #e2e8f0;
        }

        .export-btn {
            background: linear-gradient(to right, #f59e0b, #f97316);
            display: inline-block;
            padding: 12px 22px;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: 0.2s;
        }

        .export-btn:hover {
            transform: scale(1.03);
        }

        .import-form {
            margin-top: 20px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Экскурсионное бюро — Админ панель</h1>

    {% if message %}
    <div class="message {{ message.type }}">
        {{ message.text }}
    </div>
    {% endif %}

    <!-- Добавить гида -->

    <div class="form-box">

        <h2>Добавить гида</h2>

        <form action="/add-guide" method="post">

            <label>ФИО гида:</label>
            <input type="text" name="full_name" required>
            <br>

            <label>Опыт работы:</label>
            <input type="number" name="experience_years" required>
            <br><br>

            <button type="submit">
                Добавить
            </button>

        </form>

    </div>

    <!-- Добавить клиента -->

    <div class="form-box">

        <h2>Добавить клиента</h2>

        <form action="/add-client" method="post">

            <label>ФИО клиента:</label>
            <input type="text" name="full_name" required>
            <br>

            <label>Телефон:</label>
            <input type="text" name="phone" required>
            <br>

            <label>Email:</label>
            <input type="email" name="email" required>
            <br><br>

            <button type="submit">
                Добавить
            </button>

        </form>

    </div>

    <!-- Добавить экскурсию -->

    <div class="form-box">

        <h2>Добавить экскурсию</h2>

        <form action="/add-excursion" method="post">

            <label>Название экскурсии:</label>
            <input type="text" name="title" required>
            <br>

            <label>Город:</label>
            <input type="text" name="city" required>
            <br>

            <label>Цена:</label>
            <input type="number" step="0.01" name="price" required>
            <br>

            <label>Гид:</label>

            <select name="guide_id" required>

                <option value="">
                    -- Выберите --
                </option>

                {% for guide in guides %}
                <option value="{{ guide.id }}">
                    {{ guide.full_name }}
                </option>
                {% endfor %}

            </select>

            <br><br>

            <button type="submit">
                Добавить
            </button>

        </form>

    </div>

    <!-- Добавить бронирование -->

    <div class="form-box">

        <h2>Добавить бронирование</h2>

        <form action="/add-booking" method="post">

            <label>Клиент:</label>

            <select name="client_id" required>

                <option value="">
                    -- Выберите --
                </option>

                {% for client in clients %}
                <option value="{{ client.id }}">
                    {{ client.full_name }}
                </option>
                {% endfor %}

            </select>

            <br>

            <label>Экскурсия:</label>

            <select name="excursion_id" required>

                <option value="">
                    -- Выберите --
                </option>

                {% for excursion in excursions %}
                <option value="{{ excursion.id }}">
                    {{ excursion.title }}
                </option>
                {% endfor %}

            </select>

            <br>

            <label>Дата бронирования:</label>
            <input type="date" name="booking_date" required>
            <br>

            <label>Количество людей:</label>
            <input type="number" name="people_count" required>
            <br><br>

            <button type="submit">
                Добавить
            </button>

        </form>

    </div>

    <!-- Экспорт / Импорт -->

    <div class="form-box">

        <h2>Экспорт / Импорт XML</h2>

        <a href="/export/bookings/xml"
           class="export-btn">

            Экспортировать бронирования (XML)

        </a>

        <div class="import-form">

            <hr>

            <h3>Импорт бронирований из XML</h3>

            <form action="/import/bookings/xml"
                  method="post"
                  enctype="multipart/form-data">

                <label>XML файл:</label>

                <input type="file"
                       name="file"
                       accept=".xml"
                       required>

                <br><br>

                <button type="submit"
                        style="background: linear-gradient(to right, #0f766e, #14b8a6); margin-left: 0;">

                    Импортировать

                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
